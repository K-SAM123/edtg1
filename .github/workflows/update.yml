name: Update timetable

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build calendars
        run: python edt.py

      - name: Save if the timetable changed
        run: |
          git add *.ics
          if git diff --cached --quiet -I '^DTSTAMP'; then
            echo "No change"
          else
            git config user.name "edt-bot"
            git config user.email "edt-bot@users.noreply.github.com"
            git commit -m "Update timetable"
            git push
          fi
